name: release

# Push to main (or a v* tag) -> if no release exists yet for versionName, build the signed APK and
# publish GitHub Release "v<versionName>". No manual tagging: bump versionName and push to ship.
# The README's green "Download latest" button points at releases/latest, so it auto-refreshes.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"
          else TAG="v$(grep -m1 'versionName =' app/build.gradle.kts | grep -oE '[0-9]+(\.[0-9]+)+')"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
          # ponytail: later steps all gated on this; split jobs if the workflow grows

      - if: steps.v.outputs.exists != 'true'
        uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - if: steps.v.outputs.exists != 'true'
        uses: gradle/actions/setup-gradle@v6

      # Stable signature from repo secrets if set; otherwise a throwaway CI key so the APK
      # still installs. ponytail: throwaway key changes per release (users reinstall to update)
      # — add the 4 secrets once to fix the signature permanently.
      - name: Signing config
        if: steps.v.outputs.exists != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/angra-release.jks
          else
            KEYSTORE_PASSWORD=$(openssl rand -hex 16); KEY_PASSWORD=$KEYSTORE_PASSWORD; KEY_ALIAS=angra
            keytool -genkeypair -keystore app/angra-release.jks -alias angra -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=Angra Streaming"
          fi
          printf 'storeFile=angra-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - if: steps.v.outputs.exists != 'true'
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Publish release with APK
        if: steps.v.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true   # auto changelog from commits/PRs since the last tag
